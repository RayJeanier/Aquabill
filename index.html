<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="img/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AquaBill Admin Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">

</head>

<body>

    <!-- drifting waves across the bottom of the page (decoration) -->
    <div class="waves" aria-hidden="true">
        <svg class="wave back" viewBox="0 0 1440 120" preserveAspectRatio="none">
            <path d="M0 60 Q 180 20 360 60 T 720 60 T 1080 60 T 1440 60 V120 H0 Z"/>
        </svg>
        <svg class="wave middle" viewBox="0 0 1440 120" preserveAspectRatio="none">
            <path d="M0 70 Q 180 35 360 70 T 720 70 T 1080 70 T 1440 70 V120 H0 Z"/>
        </svg>
        <svg class="wave front" viewBox="0 0 1440 120" preserveAspectRatio="none">
            <path d="M0 80 Q 180 55 360 80 T 720 80 T 1080 80 T 1440 80 V120 H0 Z"/>
        </svg>
    </div>

    <!-- LEFT PANEL -->

    <div class="left">

        <!-- rising bubbles (decoration) -->
        <div class="bubbles" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
        </div>

        <div class="logo">
            <span class="logo-mark">
                <span class="ripple" aria-hidden="true"></span>
                <span class="ripple delay" aria-hidden="true"></span>
                <img src="img/favicon.svg" alt="AquaBill Logo">
            </span>
            <span>AquaBill</span>
        </div>

        <h1>
            <span class="line">San Vicente's</span>
            <span class="line">Modern water billing,</span>
            <span class="line"><span class="shine">simplified.</span></span>
        </h1>

        <p>
            Manage consumers, monitor payments, and respond to maintenance
            requests — all from one.
        </p>

    </div>

    <!-- RIGHT PANEL -->

    <div class="right">

        <div class="login-card">

            <h2>Welcome Back</h2>

            <p>
                Sign in to your account
            </p>

            <form method="POST" action="action/login.php">

                <input
                    type="text"
                    name="user_code"
                    placeholder="USER ID OR USERNAME (eg. SVOB-XXXX-XXXXXX)"
                    autocomplete="username"
                    autocapitalize="characters"
                    autocorrect="off"
                    spellcheck="false"
                    required
                >

                <div class="password-wrap">
                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >

                    <!-- show / hide password -->
                    <button type="button" class="toggle-password" id="togglePassword"
                            aria-label="Show password" aria-pressed="false" title="Show password">
                        <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 3l18 18"/>
                            <path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/>
                            <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
                        </svg>
                    </button>
                </div>

                <button type="submit">
                    Sign In
                </button>

            </form>

            <div class="footer-text">
                SVOB Water Billing System
            </div>

        </div>

    </div>
    <!-- Themed pop-up notifications (logout / login errors) -->
    <div class="toast-area" id="toastArea" aria-live="polite"></div>

    <!-- Loading screen shown while signing in -->
    <div class="loading-screen" id="loadingScreen" role="status" aria-live="polite" hidden>
        <div class="loader">

            <!-- big drop that fills with moving water -->
            <svg class="drop-loader" viewBox="0 0 120 160" aria-hidden="true">
                <defs>
                    <clipPath id="dropClip">
                        <path d="M60 6C52 20 18 62 18 100a42 42 0 0 0 84 0C102 62 68 20 60 6Z"/>
                    </clipPath>
                </defs>

                <path class="drop-glass" d="M60 6C52 20 18 62 18 100a42 42 0 0 0 84 0C102 62 68 20 60 6Z"/>

                <g clip-path="url(#dropClip)">
                    <g class="drop-fill" transform="translate(0 110)">
                        <path class="drop-wave back"  d="M0 12Q30 0 60 12T120 12T180 12T240 12T300 12T360 12V200H0Z"/>
                        <path class="drop-wave front" d="M0 16Q30 6 60 16T120 16T180 16T240 16T300 16T360 16V200H0Z"/>
                    </g>
                </g>

                <path class="drop-outline" d="M60 6C52 20 18 62 18 100a42 42 0 0 0 84 0C102 62 68 20 60 6Z"/>
                <path class="drop-shine" d="M38 100c0-14 7-29 14-40"/>
            </svg>

            <!-- droplets dripping into rippling water -->
            <div class="splash" aria-hidden="true">
                <span class="drip"></span>
                <span class="drip d2"></span>
                <span class="ring"></span>
                <span class="ring r2"></span>
                <span class="ring r3"></span>
            </div>

            <p class="loading-title">Signing you in<span class="dots" id="loadingDots"></span></p>
            <p class="loading-sub" id="loadingSub">Checking your account</p>
        </div>
    </div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const logout = urlParams.get("logout");
    const error = urlParams.get("error");

    const toastIcons = {
        success: '<path d="M20 6 9 17l-5-5"/>',
        error:   '<circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>'
    };

    // Shows a themed pop-up that closes itself after `duration` ms (or with the X button)
    function showToast(type, title, message, duration = 4000) {
        const toast = document.createElement("div");
        toast.className = "toast " + type;
        toast.setAttribute("role", type === "error" ? "alert" : "status");
        toast.style.setProperty("--duration", duration + "ms");

        toast.innerHTML =
            '<span class="toast-icon"><svg viewBox="0 0 24 24" aria-hidden="true">' + toastIcons[type] + '</svg></span>' +
            '<div class="toast-text"><strong></strong><span></span></div>' +
            '<button type="button" class="toast-close" aria-label="Close">' +
                '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>' +
            '</button>' +
            '<span class="toast-timer" aria-hidden="true"></span>';

        // textContent, so a message from the URL can never inject HTML
        toast.querySelector("strong").textContent = title;
        toast.querySelector(".toast-text span").textContent = message;

        const close = () => {
            toast.classList.add("leaving");
            toast.addEventListener("animationend", () => toast.remove(), { once: true });
        };

        toast.querySelector(".toast-close").addEventListener("click", close);
        const timer = setTimeout(close, duration);

        // Pause while the mouse is over it, so it can be read
        toast.addEventListener("mouseenter", () => { clearTimeout(timer); toast.classList.add("paused"); });
        toast.addEventListener("mouseleave", () => setTimeout(close, 1500));

        document.getElementById("toastArea").appendChild(toast);
    }

    if (logout === "success") {
        showToast("success", "Logged out", "You have successfully logged out. See you again!");
    }

    if (error) {
        showToast("error", "Couldn't sign you in", error, 6000);
    }

    // ---------- Loading screen while signing in ----------
    const loginForm = document.querySelector(".login-card form");
    const loadingScreen = document.getElementById("loadingScreen");
    let loadingTimers = [];

    // Water inside the big drop: the level rises and falls while the waves slide sideways
    const dropFill  = loadingScreen.querySelector(".drop-fill");
    const waveFront = loadingScreen.querySelector(".drop-wave.front");
    const waveBack  = loadingScreen.querySelector(".drop-wave.back");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let waterFrame = null;

    function animateWater(start) {
        const step = (now) => {
            const t = (now - start) / 1000;                            // seconds since it opened
            const level = 92 - 52 * Math.sin(t * 1.1);                 // 40 (nearly full) .. 144 (empty)
            const shift = (t * 75) % 120;                              // one wave = 120 units wide

            dropFill.setAttribute("transform", "translate(0 " + level.toFixed(1) + ")");
            waveFront.setAttribute("transform", "translate(" + (-shift).toFixed(1) + " 0)");
            waveBack.setAttribute("transform", "translate(" + (shift - 120).toFixed(1) + " 0)");

            waterFrame = requestAnimationFrame(step);
        };
        waterFrame = requestAnimationFrame(step);
    }

    function showLoading() {
        loadingScreen.hidden = false;
        document.body.classList.add("is-loading");

        if (reduceMotion) {
            dropFill.setAttribute("transform", "translate(0 70)");     // half full, not moving
        } else {
            animateWater(performance.now());
        }

        // "Signing you in", "Signing you in.", ".." , "..."
        let dots = 0;
        loadingTimers.push(setInterval(() => {
            dots = (dots + 1) % 4;
            document.getElementById("loadingDots").textContent = ".".repeat(dots);
        }, 450));

        // If it's slow (the free server waking up), say so instead of looking stuck
        const sub = document.getElementById("loadingSub");
        loadingTimers.push(setTimeout(() => { sub.textContent = "Still working on it"; }, 4000));
        loadingTimers.push(setTimeout(() => {
            sub.textContent = "The server is waking up - this can take up to a minute";
        }, 9000));
    }

    loginForm.addEventListener("submit", (e) => {
        // Already on its way (stops double-clicks)
        if (loginForm.dataset.submitting) {
            e.preventDefault();
            return;
        }

        e.preventDefault();
        loginForm.dataset.submitting = "1";
        loginForm.querySelector("button[type=submit]").disabled = true;
        showLoading();

        // Short pause so the animation is seen, then send the form for real
        setTimeout(() => loginForm.submit(), 700);
    });


    // ---------- Back to the login page = logged out ----------
    // Pressing Back after logging in lands here. Whoever was still logged in is logged
    // out, so pressing Forward can't show their account again (account pages always
    // re-check with the server - see includes/no_cache.php).
    function endSession() {
        fetch("action/end_session.php", { method: "POST", cache: "no-store", credentials: "same-origin" })
            .then((response) => response.json())
            .then((data) => {
                if (data.loggedOut) {
                    showToast("success", "Logged out", "You went back to the login page, so you've been logged out for your safety.");
                }
            })
            .catch(() => { /* server unreachable - nothing to do */ });
    }

    // Just logged out with the Log Out button -> already done
    if (logout !== "success") {
        endSession();
    }

    // ---------- Show / hide password ----------
    const passwordInput  = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");

    function setPasswordVisible(visible) {
        passwordInput.type = visible ? "text" : "password";
        togglePassword.setAttribute("aria-pressed", visible);
        togglePassword.setAttribute("aria-label", visible ? "Hide password" : "Show password");
        togglePassword.title = visible ? "Hide password" : "Show password";
    }

    togglePassword.addEventListener("click", () => {
        setPasswordVisible(passwordInput.type === "password");
        passwordInput.focus();
    });

    // Never send the form with the password showing as plain text in the field
    loginForm.addEventListener("submit", () => setPasswordVisible(false));

    // ---------- Back/Forward = open the login page fresh ----------
    window.addEventListener("pageshow", (e) => {
        // Restored from the browser's memory (typed values, loading screen and all):
        // load it again from scratch instead. The fresh page logs out (above) too.
        if (e.persisted) {
            location.reload();
            return;
        }

        // Normal load: browsers may still fill back what was typed before - clear it
        loginForm.reset();
        setPasswordVisible(false);
    });

    // Remove ?logout / ?error from the address bar so a refresh doesn't show it again
    if (logout || error) {
        history.replaceState(null, "", window.location.pathname);
    }
</script>
</body>
</html>
