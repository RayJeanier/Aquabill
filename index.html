<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AquaBill Admin Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
</head>

<body>

    <!-- LEFT PANEL -->

    <div class="left">

        <div class="logo">
            <img src="img/Untitled design (1).png" alt="AquaBill Logo">
            <span>AquaBill</span>
        </div>

        <h1>
            San Vicente's Modern water billing, simplified.
        </h1>

        <p>
            Manage consumers, monitor payments, and respond to maintenance
            requests — all from one.
        </p>

    </div>

    <!-- RIGHT PANEL -->

    <div class="right">

        <div class="login-card">

            <h2>Welcome Back</h2>

            <p>
                Sign in to your account
            </p>

            <form method="POST" action="action/login.php">

                <input
                    type="text"
                    name="user_code"
                    placeholder="User ID"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Sign In
                </button>

            </form>

            <div class="footer-text">
                SVOB Water Billing System
            </div>

        </div>

    </div>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const logout = urlParams.get("logout");

    const error = urlParams.get("error");

    if (logout === "success") {
        alert("You have successfully logged out!");
    }

    if (error) {
        alert(error);
    }
</script>
</body>
</html>
